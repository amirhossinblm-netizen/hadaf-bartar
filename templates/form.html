{% extends "base.html" %}{% block content %}<div class="auth-wrap"><div class="form-card wide"><span class="eyebrow">مدیریت محتوا</span><h1>{{ title }}</h1><form method="post">{{ form.hidden_tag() }}{% for field in form if field.name not in ['csrf_token','submit'] %}<label>{{ field.label }}{{ field(class_='input') }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}<button class="btn gold full" type="submit">{{ form.submit.label.text }}</button></form>{% if extra is defined %}<h3>سؤال‌های ثبت‌شده</h3>{% for q in extra %}<div class="notice">{{ q.prompt }}</div>{% endfor %}{% endif %}</div></div>{% endblock %}
