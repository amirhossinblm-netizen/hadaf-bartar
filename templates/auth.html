{% extends "base.html" %}{% block content %}<div class="auth-wrap"><div class="form-card"><span class="eyebrow">به هدف برتر خوش آمدی</span><h1>{{ title }}</h1><form method="post">{{ form.hidden_tag() }}{% for field in form if field.name not in ['csrf_token','submit'] %}<label>{{ field.label }}{{ field(class_='input') }}{% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}</label>{% endfor %}<button class="btn gold full" type="submit">{{ form.submit.label.text }}</button></form>{% if mode=='register' %}<p>حساب داری؟ <a class="gold-link" href="{{ url_for('login') }}">وارد شو</a></p>{% else %}<p>حساب نداری؟ <a class="gold-link" href="{{ url_for('register') }}">ثبت‌نام کن</a></p>{% endif %}</div></div>{% endblock %}
